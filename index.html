<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContactHub - Smart Contact Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-dark-white">
    <nav class="navbar navbar-expand-lg fixed-top bg-body-tertiary">
      <div
        class="container-lg container-fluid px-3 px-lg-0 d-lg-flex justify-content-lg-between"
      >
        <div class="navbar-brand d-flex align-items-center gap-2">
          <span class="fa-stack">
            <i
              class="fa-solid fa-address-book rounded-3 text-white bg-linear fa-stack-1x"
            ></i>
          </span>
          <div>
            <p class="fw-bold fs-4 text-dark-gray">
              Contact<span class="text-main">Hub</span>
            </p>
            <p class="fw-medium fs-12 text-gray">Smart Contact Manager</p>
          </div>
        </div>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav align-items-center gap-3">
            <li class="nav-item">
              <button
                class="btn d-flex align-items-center border-0 py-2 px-3 rounded-3 bg-linear gap-1"
                data-bs-toggle="modal"
                data-bs-target="#contactModal"
              >
                <i class="fas fa-plus fa-xs text-white"></i>
                <span class="d-sm-none text-white fw-semibold fs-14">Add</span>
                <span class="d-none d-sm-block text-white fw-semibold fs-14"
                  >Add Contact</span
                >
              </button>
            </li>
            <li class="nav-item d-none d-sm-block">
              <button class="btn px-1 border-0">
                <i class="fas fa-bell text-light-gray"></i>
              </button>
            </li>
            <li class="nav-item d-none d-sm-block">
              <button class="btn px-1 border-0">
                <i class="fas fa-gear text-light-gray"></i>
              </button>
            </li>
            <li class="nav-item">
              <div class="navbar-img">
                <img
                  src="img/avatar-4.jpg"
                  alt="user-img"
                  class="rounded-3 border-3 border-orange"
                />
              </div>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="mt-5 pt-5">
      <div class="modal" id="contactModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content overflow-y-auto max-h">
            <div class="modal-header border-bottom-0">
              <h5 class="modal-title">Add New Contact</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form>
                <div class="mb-3">
                  <label for="fullName" class="form-label">Full Name *</label>
                  <input
                    type="text"
                    class="form-control"
                    id="fullName"
                    placeholder="Enter full name"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="phoneNumber" class="form-label"
                    >Phone Number *</label
                  >
                  <input
                    type="tel"
                    class="form-control"
                    id="phoneNumber"
                    placeholder="e.g.,01012345678"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="emailAddress" class="form-label"
                    >Email Address</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="emailAddress"
                    placeholder="Enter email address"
                  />
                </div>
                <div class="mb-3">
                  <label for="address" class="form-label">Address</label>
                  <input
                    type="text"
                    class="form-control"
                    id="address"
                    placeholder="Enter address"
                  />
                </div>
                <div class="mb-3">
                  <label for="group" class="form-label">Group</label>
                  <select class="form-control" id="group">
                    <option value="">Select a group</option>
                    <option value="family">Family</option>
                    <option value="friends">Friends</option>
                    <option value="work">Work</option>
                    <option value="school">School</option>
                    <option value="other">Other</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="notes" class="form-label">Notes</label>
                  <textarea
                    class="form-control"
                    id="notes"
                    rows="3"
                    placeholder="Additional notes"
                  ></textarea>
                </div>
                <div class="mb-3 d-flex gap-3">
                  <label for="contactFavorite" class="cursor">
                    <input type="checkbox" id="contactFavorite">
                    <span>
                      <i class="fas fa-star text-gold"></i>
                      Favorite
                    </span>
                  </label>
                  <label for="contactEmergency" class="cursor">
                    <input type="checkbox" id="contactEmergency">
                    <span>
                      <i class="fas fa-heart-pulse text-red"></i>
                      Emergency
                    </span>
                  </label>
                </div>
              </form>
            </div>
            <div class="modal-footer border-top-0">
              <button
                type="button" id="closeButton"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button type="button" id="saveButton" class="btn btn-primary">
                Save changes
              </button>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div class="container-lg px-4 row">
          <div class="p-2 w-50">
            <div
              class="bg-white shadow-sm rounded-4 p-3 d-flex align-items-center gap-3"
            >
              <span class="fa-stack fa-2x">
                <i class="fa-solid fa-square text-danger fa-stack-2x"></i>
                <i class="fa-solid fa-users fa-stack-1x fa-inverse"></i>
              </span>
              <div>
                <p>TOTAL</p>
                <p>0</p>
              </div>
            </div>
          </div>
          <div class="p-2 w-50">
            <div
              class="bg-white shadow-sm rounded-4 p-3 d-flex align-items-center gap-3"
            >
              <span class="fa-stack fa-2x">
                <i class="fa-solid fa-square fa-stack-2x"></i>
                <i class="fa-solid fa-star fa-stack-1x fa-inverse"></i>
              </span>
              <div>
                <p>FAVORITE</p>
                <p>0</p>
              </div>
            </div>
          </div>
          <div class="p-2 w-50">
            <div
              class="bg-white shadow-sm rounded-4 p-3 d-flex align-items-center gap-3"
            >
              <span class="fa-stack fa-2x">
                <i class="fa-solid fa-square fa-stack-2x"></i>
                <i class="fa-solid fa-heart-pulse fa-stack-1x fa-inverse"></i>
              </span>
              <div>
                <p>EMERGENCY</p>
                <p>0</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="main.js"></script>
  </body>
</html>
